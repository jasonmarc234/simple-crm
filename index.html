<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple CRM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Simple CRM</h1>
            <p>Manage your clients, track interactions, and close more deals</p>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <h2 style="margin-bottom: 20px; color: #333;">Add New Client</h2>
                <form id="clientForm">
                    <div class="form-group">
                        <label>Name *</label>
                        <input type="text" id="clientName" required>
                    </div>
                    <div class="form-group">
                        <label>Company</label>
                        <input type="text" id="clientCompany">
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="clientEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" id="clientPhone">
                    </div>
                    <div class="form-group">
                        <label>Amount (AED)</label>
                        <input type="number" id="clientAmount" placeholder="0.00" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label>Lead Status *</label>
                        <select id="clientStatus" required>
                            <option value="new">New</option>
                            <option value="contacted">Contacted</option>
                            <option value="uncontactable">Uncontactable</option>
                            <option value="undernego">Under Nego</option>
                            <option value="fullypaid">Fully Paid</option>
                            <option value="pullout">Pullout</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Priority *</label>
                        <select id="clientPriority" required>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Client</button>
                </form>
            </div>

            <div class="content-area">
                <div class="filters">
                    <div class="filter-item">
                        <label>Filter by Status</label>
                        <select id="filterStatus">
                            <option value="all">All Statuses</option>
                            <option value="new">New</option>
                            <option value="contacted">Contacted</option>
                            <option value="uncontactable">Uncontactable</option>
                            <option value="undernego">Under Nego</option>
                            <option value="fullypaid">Fully Paid</option>
                            <option value="pullout">Pullout</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label>Filter by Priority</label>
                        <select id="filterPriority">
                            <option value="all">All Priorities</option>
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label>Sort by</label>
                        <select id="sortBy">
                            <option value="date-desc">Newest First</option>
                            <option value="date-asc">Oldest First</option>
                            <option value="name-asc">Name (A-Z)</option>
                            <option value="name-desc">Name (Z-A)</option>
                            <option value="priority">Priority (High to Low)</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label>Search</label>
                        <input type="text" id="searchInput" placeholder="Search clients...">
                    </div>
                </div>

                <div id="clientsList" class="clients-grid"></div>
            </div>
        </div>
    </div>

    <div id="interactionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Log Interaction</div>
            <form id="interactionForm">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="interactionDate" required>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select id="interactionType" required>
                        <option value="call">Phone Call</option>
                        <option value="email">Email</option>
                        <option value="meeting">Meeting</option>
                        <option value="note">Note</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="interactionNotes" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Save Interaction</button>
                <button type="button" class="btn btn-secondary" onclick="closeInteractionModal()">Cancel</button>
            </form>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Edit Client</div>
            <form id="editClientForm">
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="editClientName" required>
                </div>
                <div class="form-group">
                    <label>Company</label>
                    <input type="text" id="editClientCompany">
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="editClientEmail" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="editClientPhone">
                </div>
                <div class="form-group">
                    <label>Amount (AED)</label>
                    <input type="number" id="editClientAmount" placeholder="0.00" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label>Lead Status *</label>
                    <select id="editClientStatus" required>
                        <option value="new">New</option>
                        <option value="contacted">Contacted</option>
                        <option value="uncontactable">Uncontactable</option>
                        <option value="undernego">Under Nego</option>
                        <option value="fullypaid">Fully Paid</option>
                        <option value="pullout">Pullout</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Priority *</label>
                    <select id="editClientPriority" required>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Update Client</button>
                <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
